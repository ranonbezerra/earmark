[project]
name = "ouvinte"
version = "0.1.0"
description = "Local-first study recorder: transcribes mic + system audio, summarizes sessions and extracts next-day tasks."
license = { text = "MIT" }
authors = [{ name = "Ranon Bezerra" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "markdown>=3.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# On-device transcription with MLX (Apple Silicon only).
local = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26",
]

[project.scripts]
ouvinte = "ouvinte.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ouvinte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
